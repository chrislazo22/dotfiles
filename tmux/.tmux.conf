# General -------------------------------------------------

unbind C-b                   # set bind to CTRL-a
set -g prefix C-a
bind C-a send-prefix

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"       # split horizontal with | 
bind - split-window -v -c "#{pane_current_path}"      # split vertical with -

bind -n M-h select-pane -L   # use Alt-Vim keys without prefix key to switch panes
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind q killp                 # close window

setw -g automatic-rename on  # Set window names automatically

set -q -g status-utf8 on     # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g history-limit 20000   # boost history

# reload configuration
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!" 

# Display -------------------------------------------------

set -g base-index 1          # start windows numbering at 1
setw -g pane-base-index 1    # make pane numbering consistent with windows

setw -g automatic-rename on  # rename window to reflect current program
set -g renumber-windows on   # renumber windows when a window is closed

# slightly longer pane indicators display time
set -g display-panes-time 800 
set -g display-time 1000     # slightly longer status messages display time

set -g pane-active-border-style "fg=#2596be"

set -g message-style "fg=#D4D3D3"

# Navigation ----------------------------------------------
bind > swap-pane -D          # swap current pane with the next one
bind < swap-pane -U          # swap current pane with the previous one

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind -r C-l last-window      # select next window

# swap windows (adjacent with focus follow)
unbind-key -T prefix M-Left
unbind-key -T prefix M-Right
bind-key -n M-Left swap-window -t -1 \; select-window -t -1
bind-key -n M-Right swap-window -t +1 \; select-window -t +1

# swap current window with specific window number (ALT-[1-9])
bind-key -n M-1 if-shell "[ #{window_index} -ne 1 ]" "swap-window -t 1; select-window -t 1"
bind-key -n M-2 if-shell "[ #{window_index} -ne 2 ]" "swap-window -t 2; select-window -t 2"
bind-key -n M-3 if-shell "[ #{window_index} -ne 3 ]" "swap-window -t 3; select-window -t 3"
bind-key -n M-4 if-shell "[ #{window_index} -ne 4 ]" "swap-window -t 4; select-window -t 4"
bind-key -n M-5 if-shell "[ #{window_index} -ne 5 ]" "swap-window -t 5; select-window -t 5"
bind-key -n M-6 if-shell "[ #{window_index} -ne 6 ]" "swap-window -t 6; select-window -t 6"
bind-key -n M-7 if-shell "[ #{window_index} -ne 7 ]" "swap-window -t 7; select-window -t 7"
bind-key -n M-8 if-shell "[ #{window_index} -ne 8 ]" "swap-window -t 8; select-window -t 8"
bind-key -n M-9 if-shell "[ #{window_index} -ne 9 ]" "swap-window -t 9; select-window -t 9"

# Toggle mouse mode
bind m \
  if-shell -F "#{mouse}" \
  "set -g mouse off" \
  "set -g mouse on"

bind S setw synchronize-panes # sync all panes

# Status Line ---------------------------------------------
# color
set -g status-bg "#000000"
set -g status-fg "#D3D3D3"

# Align window list to the left
set -g status-justify left

# Increase status bar lengths to prevent truncation
set -g status-left-length 50
set -g status-right-length 100

# left status line info
set -g status-left " #S | "
set -g window-status-current-format "#[fg=#2596be,bold,underscore] #I #W #[default] | "
set -g window-status-format "#I #W | "

# right status line info
# Only show mouse/zoom indicators when active
set -g status-right "#{?mouse,Mouse | ,}#{?window_zoomed_flag,Zoomed | ,}#[fg=#D3D3D3]%I:%M %p | #[fg=#D3D3D3]%b %d, %Y | crunchy "

# TPM -----------------------------------------------------

set -g @plugin "jaclu/tmux-power-zoom"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Resurrect settings
set -g @resurrect-strategy-nvim 'session'  # Restore nvim sessions
set -g @resurrect-capture-pane-contents 'on'  # Restore pane contents

# Continuum settings
set -g @continuum-restore 'on'  # Auto-restore last saved session on tmux start
set -g @continuum-save-interval '15'  # Auto-save every 15 minutes

run "~/.config/tmux/plugins/tpm/tpm" # Initialize TMUX plugin manager
